name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          $base = ([xml](Get-Content src/CoffeeCup/CoffeeCup.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $v = $base   # pushes to main are released as v<Version>
          } else {
            $v = "$base-build.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build app
        run: dotnet build src/CoffeeCup/CoffeeCup.csproj -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\CoffeeCup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: CoffeeCup-Setup-${{ steps.version.outputs.version }}
          path: dist/*.exe

      # Every push to main (or a v* tag) publishes a GitHub Release with the installer.
      # The release is named after <Version> in CoffeeCup.csproj: bump it to publish a new one.
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $tag = "v$v"
          $files = (Get-ChildItem dist/*.exe).FullName
          $existing = gh release list --limit 1000 --json tagName --jq '.[].tagName'
          if ($existing -contains $tag) {
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              gh release upload $tag $files --clobber
            } else {
              Write-Host "Release $tag already exists; bump <Version> in CoffeeCup.csproj to publish a new one."
            }
          } else {
            gh release create $tag $files --target $env:GITHUB_SHA --title "CoffeeCup $v" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
